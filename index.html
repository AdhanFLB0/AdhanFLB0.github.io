<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superas ele</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        h1{
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            color: #837e7e;
            text-align: center;
            margin-top: 50px;
        }
         /* --- TEMA "LIGHT/CLEAN" (Versão Purple Image - ORIGINAL MANTIDA) --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    img {
      /* Ajuste para imagens dentro do frame */
      width: 100%;
      height: auto;
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .container {
      background: #fff;
      width: 100%;
      max-width: 950px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(103, 58, 183, 0.15);
      /* Sombra Roxa */
      padding: 40px;
      position: relative;
      overflow: hidden;
      border: 1px solid #e1e1e1;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1,
    h2 {
      text-align: center;
      color: #673ab7;
      /* Roxo Principal */
      margin-bottom: 20px;
      font-weight: 600;
    }

    p {
      color: #666;
      text-align: center;
      margin-bottom: 20px;
    }

    /* --- FORMULÁRIO --- */
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #555;
    }

    input[type="number"],
    select,
    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background-color: #f9f9f9;
      color: #333;
      font-size: 16px;
      transition: border 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #673ab7;
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(103, 58, 183, 0.1);
    }

    /* Checkboxes (ADICIONADO) */
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
      background: #edebeb;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #ffffff;
      margin-bottom: 15px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .checkbox-item input {
      width: 18px;
      height: 18px;
      accent-color: #673ab7;
      margin: 0;
    }

    .extra-input {
      margin-top: 5px;
      display: block;
    }

    /* Consentimento (NOVO) */
    .consent-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #fff;
      padding: 15px;
      border: 1px solid #d1c4e9;
      border-radius: 8px;
      margin: 20px 0;
      text-align: left;
    }

    .consent-wrapper input {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      accent-color: #673ab7;
    }

    .consent-wrapper label {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.4;
      margin: 0;
      color: #555;
    }


    /* Botões */
    .btn {
      width: 100%;
      padding: 14px 25px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #673ab7, #9575cd);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.2s;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(103, 58, 183, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(103, 58, 183, 0.4);
    }

    .btn:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* --- ÁREA DO QUIZ --- */
    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      color: #888;
      font-size: 14px;
      font-weight: 600;
    }

    .timer {
      background: #ede7f6;
      color: #673ab7;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #d1c4e9;
    }

    /* Layout de Mídia */
    .media-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 20px;
      align-items: center;
      width: 100%;
    }

    .image-column {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .image-frame {
      width: 100%;
      background: #eee;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      border: 1px solid #ddd;
    }

    /* Comparativo: Lado a Lado */
    .media-container.dual {
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      position: relative;
    }

    .media-container.dual::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #ddd;
      transform: translateX(-50%);
    }

    .dual .image-column {
      width: 48%;
    }

    .card-label {
      font-weight: 800;
      color: #673ab7;
      text-align: center;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Pergunta */
    .question-text {
      text-align: center;
      margin: 20px 0;
      font-weight: 600;
      font-size: 1.1rem;
      color: #333;
    }

    /* Controles */
    .quiz-controls {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .control-box {
      flex: 1;
      min-width: 300px;
      padding: 20px;
      border-radius: 12px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
    }

    .control-box h4 {
      margin-bottom: 15px;
      color: #673ab7;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
      font-weight: 600;
    }

    /* Radio Options */
    .radio-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      background: #fff;
      transition: 0.2s;
      margin-bottom: 10px;
    }

    .radio-option:hover {
      border-color: #673ab7;
      background: #f3e5f5;
    }

    .radio-option input {
      margin: 0;
      width: auto !important;
      accent-color: #673ab7;
      transform: scale(1.2);
    }

    .radio-option:has(input:checked) {
      border-color: #673ab7;
      background: #ede7f6;
      color: #673ab7;
    }

    /* Scale Confiança */
    .scale-container {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
    }

    .scale-item {
      flex: 1;
    }

    .scale-item input {
      display: none;
    }

    .scale-item label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #fff;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 15px 5px;
      cursor: pointer;
      transition: 0.3s;
      color: #888;
      height: 100%;
      font-weight: 600;
    }

    .scale-item label:hover {
      border-color: #673ab7;
      transform: translateY(-3px);
    }

    .scale-item input:checked+label {
      background-color: #ede7f6;
      color: #673ab7;
    }

    /* Tela Final */
    .score-box {
      background: #f3e5f5;
      border: 2px solid #d1c4e9;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      width: 100%;
      max-width: 300px;
      text-align: center;
    }

    .big-score {
      font-size: 3.5rem;
      font-weight: 700;
      color: #512da8;
    }

    @media (max-width: 800px) {
      .media-container.dual {
        flex-direction: column;
      }

      .media-container.dual::after {
        display: none;
      }

      .dual .image-column {
        width: 100%;
      }

      .quiz-controls {
        flex-direction: column;
      }
    }
    button {
        display: block;
        margin: 20px auto;
        padding: 10px 20px;
        font-size: 16px;
        background-color: #673ab7;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    div#diagnostico {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #d400ff;
        border-radius: 8px;
        background-color: #080808;
        color: #fffafa;
        font-size: 16px;
    }

    select {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #d400ff;
        border-radius: 8px;
        background-color: #0e0d0d;
        color: #fff;
    }
    p {
        text-align: center;
        font-weight: 600;
        background: #0e0d0d;
        color: #fff;
    }

    </style>
</head>
<body>
    <div>
        <header>
            <h1>Psicologo automatico</h1>
        </header>
    </div>
    <div class="form-group">
        <label style="color: #673ab7;">Como está se sentindo?</label>
        <select id="reg-genero" name="genero" required>
          <option value="ND">Selecione...</option>
          <option value="A">Alegre</option>
          <option value="T">Triste</option>
          <option value="D">Depressiva</option>
          <option value="S">Com saudades</option>
          <option value="N">Não consigo definir</option>
        </select>
    </div>
    <div>
        <button type="button" onclick="confirmarSentimento()">Confirmar sentimento</button>
    </div>
    <div>
        <h1>Diagnostico:</h1>
        <div id="diagnostico">
        
        </div>
    </div>
    <script>
        function confirmarSentimento() {
            const sentimento = document.getElementById('reg-genero').value;
            if (sentimento == "ND") {
                alert(`Selecione algo, esta me testando desgraça?`);
            } else if(sentimento == "N") {
                document.getElementById("diagnostico").innerHTML = `<p>Meu diagnostico é que é frescura e você vai tomar um tapa meu, faz o L guria, como não consegue definir algo tão simples???</p>`;
            } else if (sentimento == "A") {
                document.getElementById("diagnostico").innerHTML = `<p>Meu diagnostico é que você deve continuar assim se não quiser apanhar</p>`;
            } else if (sentimento == "T") {
                document.getElementById("diagnostico").innerHTML = `<p>Meu diagnostico é que você tem que fazer o L e tomar vergonha na cara</p>`;
            } else if (sentimento == "D") {
                document.getElementById("diagnostico").innerHTML = `<p>Meu diagnostico é que você tem que fazer o L e comer um chocolate, pq meu deus, pra ficar depressiva por causa de macho tem que apanhar</p>`;
            } else if (sentimento == "S") {
                document.getElementById("diagnostico").innerHTML = `<p>Meu diagnostico é que você tem que fazer o L e tomar um banho, pq saudade de macho é frescura, tem que tomar um banho e esquecer esse lixo de macho, se não quiser apanhar</p>`;
            }
        }
    </script>
</body>
</html>
